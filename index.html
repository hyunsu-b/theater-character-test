<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>캐릭터 테스트</title>
<style>
:root{--bg:#07130f;--card:#10221b;--card2:#173126;--text:#edf4ef;--muted:#aebfb5;--accent:#b7d6bf;--line:#294438}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#183a2a 0,#07130f 48%,#040a08 100%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;min-height:100vh}
.wrap{max-width:680px;margin:auto;padding:22px 16px 48px}.hero{min-height:220px;display:flex;flex-direction:column;justify-content:flex-end;padding:28px 4px 24px}
.eyebrow{letter-spacing:.16em;color:var(--accent);font-size:12px}.title{font-size:34px;line-height:1.2;margin:10px 0}.desc{color:var(--muted);line-height:1.7;white-space:pre-line}
.card{background:rgba(16,34,27,.92);border:1px solid var(--line);border-radius:20px;padding:22px;margin-top:14px;box-shadow:0 14px 40px #0006}
h2{margin:0 0 18px;font-size:22px}.choice{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);color:var(--text);padding:16px 17px;border-radius:14px;margin:10px 0;cursor:pointer;font-size:15px;line-height:1.5}.choice:hover{border-color:var(--accent)}.choice.selected{outline:2px solid var(--accent);background:#234534}
button.primary{width:100%;border:0;border-radius:14px;padding:15px;background:var(--accent);color:#102017;font-weight:800;cursor:pointer;font-size:16px;margin-top:10px}
.progress{height:5px;background:#1c3027;border-radius:5px;overflow:hidden;margin:8px 0 20px}.bar{height:100%;background:var(--accent);transition:.25s}
.result{text-align:center}.result .symbol{font-size:54px}.result h2{font-size:28px}.result p{line-height:1.8;color:var(--muted);white-space:pre-line}.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:7px 12px;color:var(--accent);font-size:13px}
input,textarea{width:100%;background:#08150f;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:12px;margin:7px 0 14px;font:inherit}textarea{min-height:100px}
.small{font-size:12px;color:var(--muted);line-height:1.6}.hidden{display:none}.adminlink{color:#6f8e7f;font-size:11px;text-decoration:underline;cursor:pointer;margin-top:18px;display:inline-block}
.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1;min-width:120px}
hr{border:0;border-top:1px solid var(--line);margin:20px 0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const DEFAULT_CONFIG = {
  title:"당신은 이 저택에서 누구와 가장 닮았을까요?",
  eyebrow:"CHARACTER TEST",
  intro:"숲속 깊은 곳, 오래된 저택.\n당신의 선택을 따라 가장 닮은 인물을 찾아보세요.\n\n※ 약 2분 소요 · 결과 확인 후 공연 티켓 이벤트에 참여할 수 있습니다.",
  characters:{
    A:{name:"첫째",symbol:"Ⅰ",tag:"책임과 결단",desc:"가족과 주변 사람을 지키려는 책임감이 강하고, 필요한 순간에는 스스로 결단을 내리는 사람입니다."},
    B:{name:"둘째",symbol:"Ⅱ",tag:"관계와 균형",desc:"사람 사이의 관계를 중요하게 생각하며, 쉽게 한쪽으로 단정 짓기보다 상황을 바라보려는 사람입니다."},
    C:{name:"셋째",symbol:"Ⅲ",tag:"인정과 욕망",desc:"인정받고 싶은 마음이 크고, 자신의 가치를 증명하기 위해 적극적으로 움직이는 사람입니다."},
    D:{name:"넷째",symbol:"Ⅳ",tag:"순수와 호기심",desc:"세상을 있는 그대로 바라보는 듯하면서도, 자신만의 방식으로 사람과 관계를 받아들이는 사람입니다."}
  },
  questions:[
    {q:"갑자기 예상하지 못한 일이 벌어졌습니다. 당신은 가장 먼저 무엇을 하나요?",a:[["상황을 정리하고 내가 해야 할 일을 찾는다","A"],["주변 사람들의 상태부터 살핀다","B"],["왜 이런 일이 벌어졌는지 원인을 파악한다","C"],["일단 눈앞의 상황을 받아들이고 지켜본다","D"]]},
    {q:"처음 만난 사람이 당신에게 호의를 보입니다. 당신의 반응은?",a:[["고맙지만 쉽게 마음을 열지는 않는다","A"],["나도 먼저 편하게 다가가 본다","B"],["상대가 왜 그러는지 조금 더 생각해 본다","C"],["일단 기분 좋게 받아들인다","D"]]},
    {q:"친한 사람이 당신에게 중요한 비밀을 털어놓았습니다.",a:[["내가 감당할 수 있는 일인지 먼저 생각한다","A"],["그 사람이 힘들었겠다는 생각이 먼저 든다","B"],["비밀의 내용과 사실관계를 꼼꼼히 따져본다","C"],["일단 그 사람의 말을 믿어준다","D"]]},
    {q:"누군가 당신을 오해하고 있습니다. 어떻게 할까요?",a:[["필요한 말만 하고 행동으로 보여준다","A"],["직접 이야기하며 오해를 풀려고 한다","B"],["왜 오해가 생겼는지부터 분석한다","C"],["시간이 지나면 자연스럽게 알게 될 거라 생각한다","D"]]},
    {q:"당신에게 가장 중요한 것은 무엇에 가깝나요?",a:[["책임을 다하는 것","A"],["소중한 사람들과 함께하는 것","B"],["내가 인정받고 가치 있는 사람이 되는 것","C"],["내가 원하는 방식으로 살아가는 것","D"]]},
    {q:"마지막까지 하나만 지켜야 한다면?",a:[["내가 맡은 사람과 약속","A"],["사람과 사람 사이의 신뢰","B"],["내가 이루고 싶은 목표","C"],["내가 소중하게 여기는 마음","D"]]}
  ],
  eventTitle:"🎟 공연 초대 이벤트",
  eventText:"테스트를 완료한 분들 중 추첨을 통해 공연 티켓을 드립니다.\n아래 버튼을 눌러 이벤트에 참여해주세요.",
  eventUrl:"https://docs.google.com/forms/d/e/1FAIpQLScJmevX3_RNhCyn174VcuRqSL0UwGQ3Ht3Oagtv55ijJFevuQ/viewform"
};

let config = loadConfig(), idx=0, answers=[];
function loadConfig(){try{return JSON.parse(localStorage.getItem("characterTestConfig"))||DEFAULT_CONFIG}catch(e){return DEFAULT_CONFIG}}
function saveConfig(c){localStorage.setItem("characterTestConfig",JSON.stringify(c));config=c}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function renderIntro(){
 document.getElementById("app").innerHTML=`<section class="hero"><div class="eyebrow">${esc(config.eyebrow)}</div><div class="title">${esc(config.title)}</div><div class="desc">${esc(config.intro)}</div><button class="primary" onclick="start()">테스트 시작하기</button><span class="adminlink" onclick="admin()">관리자 설정</span></section>`;
}
function start(){idx=0;answers=[];renderQuestion()}
function renderQuestion(){
 const q=config.questions[idx], pct=Math.round(idx/config.questions.length*100);
 document.getElementById("app").innerHTML=`<div class="card"><div class="small">QUESTION ${idx+1} / ${config.questions.length}</div><div class="progress"><div class="bar" style="width:${pct}%"></div></div><h2>${esc(q.q)}</h2>${q.a.map((x,i)=>`<button class="choice" onclick="pick(${i})">${i+1}. ${esc(x[0])}</button>`).join("")}</div>`;
}
function pick(i){answers.push(config.questions[idx].a[i][1]);idx++; if(idx<config.questions.length)renderQuestion();else renderResult()}
function renderResult(){
 const counts={A:0,B:0,C:0,D:0};answers.forEach(x=>counts[x]++);
 const max=Math.max(...Object.values(counts)), winners=Object.keys(counts).filter(k=>counts[k]===max);
 const key=winners[Math.floor(Math.random()*winners.length)], c=config.characters[key];
 document.getElementById("app").innerHTML=`<div class="card result"><div class="symbol">${esc(c.symbol)}</div><span class="tag">${esc(c.tag)}</span><h2>당신은 ${esc(c.name)}와 가장 닮았습니다.</h2><p>${esc(c.desc)}</p><hr><p class="small">${esc(config.eventText)}</p><a href="https://docs.google.com/forms/d/10EMbC8pvu4yNDzDl5iM8_0QooHcN30LSL4/viewform" target="_blank" rel="noopener noreferrer"><button class="primary">${esc(config.eventTitle)}</button></a><span class="adminlink" onclick="renderIntro()">처음으로 돌아가기</span></div>`;
}
function admin(){
 document.getElementById("app").innerHTML=`<div class="card"><h2>관리자 설정</h2><p class="small">아래 내용을 수정한 뒤 저장하면 이 브라우저에서 바로 반영됩니다. 질문·선택지의 연결 인물은 A/B/C/D로 입력하세요.</p>
 <label>테스트 제목</label><input id="title" value="${esc(config.title)}"><label>상단 문구</label><input id="eyebrow" value="${esc(config.eyebrow)}"><label>소개 문구</label><textarea id="intro">${esc(config.intro)}</textarea>
 <h2>인물 설정</h2>${["A","B","C","D"].map(k=>`<label>${k} 인물 이름</label><input id="n${k}" value="${esc(config.characters[k].name)}"><label>${k} 태그</label><input id="t${k}" value="${esc(config.characters[k].tag)}"><label>${k} 결과 설명</label><textarea id="d${k}">${esc(config.characters[k].desc)}</textarea>`).join("")}
 <h2>질문 설정</h2>${config.questions.map((q,qi)=>`<div class="card"><label>질문 ${qi+1}</label><textarea id="q${qi}">${esc(q.q)}</textarea>${q.a.map((x,ai)=>`<label>선택지 ${ai+1} 연결 인물 (A/B/C/D)</label><input id="a${qi}_${ai}" value="${esc(x[1])}"><label>선택지 ${ai+1} 문구</label><input id="v${qi}_${ai}" value="${esc(x[0])}">`).join("")}</div>`).join("")}
 <label>티켓 이벤트 안내</label><textarea id="eventText">${esc(config.eventText)}</textarea><label>구글폼 링크</label><input id="eventUrl" value="${esc(config.eventUrl)}">
 <div class="row"><button class="primary" onclick="saveAdmin()">저장</button><button class="primary" onclick="resetConfig()">기본값 복원</button></div>
 <p class="small">※ 질문을 추가/삭제하려면 아래 JSON 편집 기능을 사용하거나, 나에게 원하는 질문 수를 알려주면 수정 버전을 만들어줄 수 있습니다.</p>
 <button class="primary" onclick="jsonEditor()">고급 설정(JSON)</button></div>`;
}
function saveAdmin(){
 const c=JSON.parse(JSON.stringify(config)); c.title=title.value;c.eyebrow=eyebrow.value;c.intro=intro.value;
 ["A","B","C","D"].forEach(k=>{c.characters[k].name=document.getElementById("n"+k).value;c.characters[k].tag=document.getElementById("t"+k).value;c.characters[k].desc=document.getElementById("d"+k).value});
 c.questions.forEach((q,qi)=>{q.q=document.getElementById("q"+qi).value;q.a.forEach((x,ai)=>{x[0]=document.getElementById(`v${qi}_${ai}`).value;x[1]=document.getElementById(`a${qi}_${ai}`).value.toUpperCase().trim()})});
 c.eventText=eventText.value;c.eventUrl=eventUrl.value;saveConfig(c);alert("저장되었습니다.");renderIntro();
}
function resetConfig(){if(confirm("기본 설정으로 복원할까요?")){localStorage.removeItem("characterTestConfig");config=JSON.parse(JSON.stringify(DEFAULT_CONFIG));admin()}}
function jsonEditor(){
 document.getElementById("app").innerHTML=`<div class="card"><h2>고급 설정</h2><p class="small">전체 설정을 JSON으로 수정할 수 있습니다. 질문을 추가하거나 삭제할 때 사용하세요.</p><textarea id="json" style="min-height:500px">${esc(JSON.stringify(config,null,2))}</textarea><button class="primary" onclick="saveJson()">JSON 저장</button><span class="adminlink" onclick="admin()">뒤로</span></div>`;
}
function saveJson(){try{const c=JSON.parse(document.getElementById("json").value);if(!c.questions||!c.characters)throw Error();saveConfig(c);alert("저장되었습니다.");renderIntro()}catch(e){alert("JSON 형식을 확인해주세요.")}}
renderIntro();
</script>
</body>
</html>
